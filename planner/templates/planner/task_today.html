{% extends "planner/base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Today's tasks</h2>
    <a href="{% url 'task_list' %}" class="btn btn-outline-secondary">All tasks</a>
</div>
<ul class="list-group">
    {% for t in tasks %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <div>
            <strong>{{ t.name }}</strong>
            {% if t.description %}<div class="small text-muted">{{ t.description }}</div>{% endif %}
        </div>
        <form method="post" action="{% url 'task_complete' t.pk %}">
            {% csrf_token %}
            <button class="btn btn-sm btn-outline-success">Complete</button>
        </form>
    </li>
    {% empty %}
    <li class="list-group-item text-muted">Nothing due today.</li>
    {% endfor %}
</ul>
{% endblock %}
