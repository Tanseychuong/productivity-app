{% extends "planner/base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>Contacts</h2>
    <a href="{% url 'contact_add' %}" class="btn btn-primary">Add contact</a>
</div>
<form method="get" class="mb-3 d-flex gap-2">
    <input type="search" name="q" value="{{ q }}" class="form-control" placeholder="Search name, phone, email">
    <button class="btn btn-outline-secondary">Search</button>
</form>
<table class="table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for c in contacts %}
        <tr>
            <td>{{ c }}</td>
            <td>{{ c.phone }}</td>
            <td>{{ c.email }}</td>
            <td class="text-end">
                <a href="{% url 'contact_edit' c.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
                <form method="post" action="{% url 'contact_delete' c.pk %}" class="d-inline"
                    onsubmit="return confirm('Delete this contact?')">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4" class="text-muted">No contacts found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
