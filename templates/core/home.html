{% extends "base.html" %}
{% block content %}
<div class="text-center mb-4">
    <h1>Smart Personal Schedule</h1>
    <p class="text-muted">Contacts, journals, notes and tasks in one place.</p>
</div>
<div class="row g-3">
    <div class="col-md-6 col-lg-3">
        <a href="{% url 'contact_list' %}" class="card text-decoration-none h-100">
            <div class="card-body">
                <h5 class="card-title">Contacts</h5>
                <p class="card-text text-muted">People and how to reach them.</p>
            </div>
        </a>
    </div>
    <div class="col-md-6 col-lg-3">
        <a href="{% url 'journal_list' %}" class="card text-decoration-none h-100">
            <div class="card-body">
                <h5 class="card-title">Journals</h5>
                <p class="card-text text-muted">Longer daily entries.</p>
            </div>
        </a>
    </div>
    <div class="col-md-6 col-lg-3">
        <a href="{% url 'note_list' %}" class="card text-decoration-none h-100">
            <div class="card-body">
                <h5 class="card-title">Notes</h5>
                <p class="card-text text-muted">Quick notes by date.</p>
            </div>
        </a>
    </div>
    <div class="col-md-6 col-lg-3">
        <a href="{% url 'task_today' %}" class="card text-decoration-none h-100">
            <div class="card-body">
                <h5 class="card-title">Today's tasks</h5>
                <p class="card-text text-muted">What's due today.</p>
            </div>
        </a>
    </div>
</div>
{% endblock %}
