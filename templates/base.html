{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Smart Personal Schedule{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Smart Personal Schedule</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'contact_list' %}">Contacts</a>
                <a class="nav-link" href="{% url 'journal_list' %}">Journals</a>
                <a class="nav-link" href="{% url 'note_list' %}">Notes</a>
                <a class="nav-link" href="{% url 'task_list' %}">Tasks</a>
            </div>
        </div>
    </nav>
    <main class="container">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>

</html>
